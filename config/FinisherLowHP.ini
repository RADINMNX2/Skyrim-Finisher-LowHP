[General]

; The key that triggers the finisher, as a DirectInput scan code.
;   G = 0x22 (34), the default and typical choice.
; Other common keys:
;   V = 0x2F,  X = 0x2D,  C = 0x2E,  F = 0x21,  R = 0x13,  E = 0x12,  T = 0x14
; To find the exact scancode for any key, look at the plugin's SKSE log line:
;   "Finisher: installed input sink (key=0x..)"
FinisherKey=0x22

; Execute enemies when their health drops to at or below this value.
FinisherHP=15
